name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install package + dev deps
        run: |
          uv venv --python ${{ matrix.python }}
          source .venv/bin/activate
          uv pip install -e '.[dev]'
      - name: Lint (ruff)
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .
      - name: Type check (mypy --strict)
        run: |
          source .venv/bin/activate
          mypy --strict src
      - name: Unit + integration tests
        run: |
          source .venv/bin/activate
          pytest -q tests/test_unit.py tests/test_integration.py
      - name: Benchmark (warn-only)
        run: |
          source .venv/bin/activate
          pytest -q tests/test_benchmark.py --benchmark-only --benchmark-json=.benchmarks/run.json || true
      - name: Docs build (mkdocs --strict)
        run: |
          source .venv/bin/activate
          mkdocs build --strict
      - name: Dependency audit (pip-audit)
        run: |
          source .venv/bin/activate
          uvx pip-audit -r <(echo -e "laspy>=2.5\nnumpy>=1.24")
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
